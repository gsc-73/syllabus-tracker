<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Analysis of Sazid Arsalan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+Bengali:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#eef4ee;
    --ink-2:#e4ede2;
    --paper:#ffffff;
    --paper-hi:#f2f7f1;
    --line:#d8e3d9;
    --chalk:#1e2b22;
    --muted:#66766c;
    --amber:#2f6f5e;
    --amber-dim:#dcece5;
    --teal:#c98a2e;
    --teal-dim:#f5e9d2;
    --red:#b3453a;
    --font-display:'Manrope','Noto Sans Bengali',sans-serif;
    --font-body:'Inter','Noto Sans Bengali',sans-serif;
    --font-mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 15% -10%, rgba(47,111,94,0.08), transparent 60%),
      radial-gradient(ellipse 700px 500px at 100% 0%, rgba(201,138,46,0.07), transparent 55%),
      var(--ink);
    color:var(--chalk);
    font-family:var(--font-body);
    min-height:100vh;
    padding-bottom:96px;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--amber); color:var(--ink); }

  /* ---------- Header ---------- */
  header.top{
    padding:22px 18px 14px;
    position:relative;
  }
  .eyebrow{
    font-family:var(--font-mono);
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--amber);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:8px;
  }
  .eyebrow::before{
    content:'';
    width:6px;height:6px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 0 3px var(--amber-dim);
  }
  .header-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .crest{ flex:none; }
  h1{
    font-family:var(--font-display);
    font-weight:700;
    font-size:23px;
    line-height:1.15;
    margin:0 0 2px;
    letter-spacing:-.01em;
  }
  .subhead{
    color:var(--muted);
    font-size:13.5px;
    margin:10px 0 0;
  }

  .overview{
    margin-top:18px;
    display:flex;
    gap:12px;
    align-items:stretch;
  }
  .ring-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:18px;
    padding:14px;
    display:flex;
    align-items:center;
    gap:14px;
    flex:1;
  }
  .ring-wrap{ position:relative; width:64px; height:64px; flex:none; }
  .ring-wrap svg{ transform:rotate(-90deg); }
  .ring-label{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-weight:700; font-size:15px;
  }
  .ring-copy .num{
    font-family:var(--font-display);
    font-size:15px;
    font-weight:600;
    color:var(--chalk);
    display:block;
  }
  .ring-copy .lbl{
    font-size:11.5px; color:var(--muted);
  }

  /* ---------- Stage tabs (staged sequence: CT -> Pre-Test -> Test) ---------- */
  .stage-track{
    margin:18px 18px 6px;
    padding:10px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    grid-template-rows:repeat(2, 1fr);
    gap:8px;
  }
  .track-divider{ display:none; }
  .stage-btn{
    width:100%;
    min-width:0;
    background:none;
    border:none;
    color:var(--muted);
    font-family:var(--font-body);
    font-weight:600;
    font-size:11px;
    padding:9px 4px;
    border-radius:10px;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    transition:color .2s, border-color .2s, background .2s;
  }
  .stage-btn > span:nth-child(2){
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:100%;
  }
  .stage-btn .n{
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--muted);
    letter-spacing:.1em;
  }
  .stage-btn.active{
    background:var(--amber-dim);
    border-color:var(--amber);
    color:var(--chalk);
  }
  .stage-btn.active .n{ color:var(--amber); }
  .stage-progress-mini{
    height:3px; background:var(--line); border-radius:2px; margin-top:6px; width:100%; overflow:hidden;
  }
  .stage-progress-mini > i{
    display:block; height:100%; background:var(--amber); border-radius:2px;
  }

  main{ padding:14px 18px 0; }

  /* ---------- Subject cards ---------- */
  .subject-card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:18px;
    margin-bottom:14px;
    overflow:hidden;
  }
  .subject-top{
    padding:15px 16px 12px;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
  }
  .subject-name{
    font-family:var(--font-display);
    font-weight:600;
    font-size:16.5px;
    line-height:1.25;
  }
  .subject-notes{
    font-size:12px;
    color:var(--muted);
    margin-top:3px;
    white-space:pre-line;
  }
  .subject-pct{
    font-family:var(--font-mono);
    font-size:13px;
    color:var(--amber);
    flex:none;
    padding-top:2px;
  }
  .bar-track{
    height:5px;
    background:var(--line);
    margin:0 16px;
    border-radius:3px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    background:linear-gradient(90deg,var(--amber),#5fae95);
    border-radius:3px;
    transition:width .35s ease;
  }
  .items{
    padding:12px 10px 6px;
  }
  .item-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:8px 6px;
    border-radius:10px;
  }
  .item-row:hover{ background:rgba(255,255,255,0.02); }
  .chk{
    flex:none;
    width:19px;height:19px;
    border-radius:6px;
    border:1.5px solid var(--muted);
    margin-top:1px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    background:transparent;
    transition:.15s;
  }
  .chk svg{ opacity:0; transition:.15s; width:12px;height:12px; }
  .item-row.done .chk{ background:var(--amber); border-color:var(--amber); }
  .item-row.done .chk svg{ opacity:1; }
  .item-text{
    flex:1;
    font-size:13.5px;
    line-height:1.45;
    cursor:pointer;
    word-break:break-word;
  }
  .item-row.done .item-text{
    color:var(--muted);
    text-decoration:line-through;
    text-decoration-color:var(--line);
  }
  .del-btn{
    flex:none;
    width:22px;height:22px;
    border:none;background:none;
    color:var(--muted);
    cursor:pointer;
    opacity:.45;
    font-size:14px;
    border-radius:6px;
  }
  .del-btn:hover{ opacity:1; color:var(--red); background:rgba(193,89,74,0.12); }

  .add-item-row{
    display:flex;
    gap:8px;
    padding:8px 6px 14px;
  }
  .add-item-row input{
    flex:1;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:9px;
    color:var(--chalk);
    font-family:var(--font-body);
    font-size:13px;
    padding:9px 11px;
    outline:none;
  }
  .add-item-row input:focus{ border-color:var(--amber); }
  .add-item-row button{
    flex:none;
    background:var(--amber-dim);
    color:var(--amber);
    border:1px solid var(--amber-dim);
    border-radius:9px;
    padding:0 14px;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
  }
  .add-item-row button:hover{ background:var(--amber); color:var(--ink); }

  .empty-items{
    padding:14px 16px 18px;
    color:var(--muted);
    font-size:12.5px;
    font-style:italic;
  }

  .link-panel{
    margin:2px 6px 12px;
    border:1px solid var(--amber-dim);
    border-radius:12px;
    background:rgba(47,111,94,0.04);
    overflow:hidden;
  }
  .link-toggle{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    background:none;
    border:none;
    border-bottom:1px solid var(--amber-dim);
    color:var(--amber);
    font-family:var(--font-body);
    font-weight:700;
    font-size:11.5px;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:11px 13px;
    text-align:left;
  }
  .link-count{
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--muted);
    flex:none;
  }
  .link-list{
    padding:2px 6px 8px;
    border-top:1px solid var(--teal-dim);
  }
  .item-row.linked .item-text{ cursor:pointer; }
  .item-row.linked{ padding:7px 6px; }

  /* ---------- Add subject ---------- */
  .add-subject-card{
    border:1.5px dashed var(--line);
    border-radius:18px;
    padding:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    color:var(--muted);
    font-weight:600;
    font-size:13.5px;
    cursor:pointer;
    margin-bottom:20px;
    background:transparent;
    width:100%;
  }
  .add-subject-card:hover{ border-color:var(--amber); color:var(--amber); }

  .new-subject-form{
    background:var(--paper);
    border:1px solid var(--amber-dim);
    border-radius:18px;
    padding:14px;
    margin-bottom:20px;
    display:none;
  }
  .new-subject-form.open{ display:block; }
  .new-subject-form input{
    width:100%;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:9px;
    color:var(--chalk);
    font-size:14px;
    padding:10px 12px;
    outline:none;
    margin-bottom:10px;
  }
  .new-subject-form input:focus{ border-color:var(--amber); }
  .form-actions{ display:flex; gap:8px; justify-content:flex-end; }
  .form-actions button{
    border-radius:9px;
    border:1px solid var(--line);
    background:none;
    color:var(--muted);
    padding:8px 14px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .form-actions button.primary{
    background:var(--amber);
    color:var(--ink);
    border-color:var(--amber);
  }

  /* ---------- Floating timer button ---------- */
  .fab{
    position:fixed;
    left:18px;
    bottom:20px;
    background:var(--teal);
    color:var(--ink);
    border:none;
    border-radius:50px;
    padding:14px 18px;
    font-family:var(--font-mono);
    font-weight:700;
    font-size:13.5px;
    display:flex;
    align-items:center;
    gap:8px;
    box-shadow:0 8px 24px rgba(201,138,46,0.35);
    cursor:pointer;
    z-index:40;
  }
  .fab .dot{ width:7px;height:7px;border-radius:50%;background:var(--ink); opacity:.55; }
  .fab.running .dot{
    animation:pulse 1s infinite;
    opacity:1;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.25;} }

  /* ---------- Timer drawer ---------- */
  .scrim{
    position:fixed; inset:0; background:rgba(8,9,14,0.6);
    opacity:0; pointer-events:none; transition:opacity .25s;
    z-index:50;
  }
  .scrim.open{ opacity:1; pointer-events:auto; }
  .drawer{
    position:fixed; left:0; right:0; bottom:0;
    background:var(--ink-2);
    border-top:1px solid var(--line);
    border-radius:22px 22px 0 0;
    padding:10px 18px 26px;
    transform:translateY(100%);
    transition:transform .3s cubic-bezier(.32,.72,0,1);
    z-index:51;
    max-height:82vh;
    overflow-y:auto;
  }
  .drawer.open{ transform:translateY(0); }
  .drawer-handle{
    width:36px;height:4px;background:var(--line);border-radius:3px;
    margin:8px auto 14px;
  }
  .drawer h2{
    font-family:var(--font-display);
    font-size:19px;
    margin:0 0 14px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .drawer h2 button{
    background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;
  }
  .timer-subject select{
    width:100%;
    background:var(--paper);
    border:1px solid var(--line);
    color:var(--chalk);
    font-family:var(--font-body);
    font-size:14px;
    padding:11px 12px;
    border-radius:11px;
    outline:none;
    margin-bottom:14px;
    appearance:none;
  }
  .mode-toggle{
    display:flex;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:11px;
    padding:3px;
    margin-bottom:14px;
  }
  .mode-toggle button{
    flex:1;
    background:none;border:none;
    color:var(--muted);
    padding:9px;
    border-radius:8px;
    font-weight:600;
    font-size:12.5px;
    cursor:pointer;
  }
  .mode-toggle button.active{ background:var(--teal-dim); color:var(--teal); }

  .presets{ display:flex; gap:8px; margin-bottom:16px; }
  .presets button{
    flex:1;
    background:var(--paper);
    border:1px solid var(--line);
    color:var(--muted);
    padding:8px 4px;
    border-radius:9px;
    font-family:var(--font-mono);
    font-size:12px;
    font-weight:600;
    cursor:pointer;
  }
  .presets button.active{ border-color:var(--teal); color:var(--teal); }

  .timer-display{
    text-align:center;
    padding:22px 0 18px;
  }
  .timer-display .clock{
    font-family:var(--font-mono);
    font-size:52px;
    font-weight:700;
    letter-spacing:.02em;
    color:var(--chalk);
  }
  .timer-display .sub{
    color:var(--muted);
    font-size:12.5px;
    margin-top:4px;
  }
  .timer-controls{
    display:flex;
    gap:10px;
    margin-bottom:20px;
  }
  .timer-controls button{
    flex:1;
    padding:14px;
    border-radius:12px;
    border:none;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    font-family:var(--font-body);
  }
  .btn-start{ background:var(--teal); color:var(--ink); }
  .btn-pause{ background:var(--paper-hi); color:var(--chalk); border:1px solid var(--line) !important; }
  .btn-reset{ background:none; color:var(--muted); border:1px solid var(--line) !important; }
  .btn-log{ background:var(--amber); color:var(--ink); }

  .stats-title{
    font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted);
    margin:6px 0 10px; font-family:var(--font-mono);
  }
  .stat-row{
    display:flex; justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .stat-row .t{ color:var(--chalk); }
  .stat-row .m{ font-family:var(--font-mono); color:var(--teal); }
  .stat-row:last-child{ border-bottom:none; }
  .no-stats{ color:var(--muted); font-size:12.5px; font-style:italic; padding:6px 0; }

  .toast{
    position:fixed; left:50%; top:16px; transform:translate(-50%,-140%);
    background:var(--paper-hi); border:1px solid var(--amber); color:var(--chalk);
    padding:10px 16px; border-radius:11px; font-size:13px; z-index:60;
    transition:transform .3s ease; box-shadow:0 8px 20px rgba(0,0,0,.4);
  }
  .toast.show{ transform:translate(-50%,0); }
</style>
</head>
<body>

<header class="top">
  <div class="header-row">
    <svg class="crest" width="46" height="46" viewBox="0 0 100 100" aria-label="College emblem">
      <circle cx="50" cy="50" r="47" fill="none" stroke="#2f6f5e" stroke-width="3"/>
      <circle cx="50" cy="50" r="40" fill="#eef4ee" stroke="#2f6f5e" stroke-width="1.5"/>
      <circle cx="50" cy="34" r="12" fill="none" stroke="#c98a2e" stroke-width="2.5"/>
      <path d="M50 22 L50 26 M50 42 L50 46 M38 34 L34 34 M66 34 L70 34 M41 25 L38.5 22.5 M59 25 L61.5 22.5 M41 43 L38.5 45.5 M59 43 L61.5 45.5" stroke="#c98a2e" stroke-width="2" stroke-linecap="round"/>
      <path d="M27 70 Q50 56 73 70 L73 60 Q50 46 27 60 Z" fill="#2f6f5e"/>
      <path d="M27 70 Q50 60 73 70" fill="none" stroke="#2f6f5e" stroke-width="2"/>
      <line x1="50" y1="46" x2="50" y2="72" stroke="#2f6f5e" stroke-width="1.5"/>
      <path d="M18 78 Q50 88 82 78" fill="none" stroke="#2f6f5e" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
    <div>
      <div class="eyebrow">HSC Science &middot; Batch 2026</div>
      <h1>Study Analysis of Sazid Arsalan</h1>
    </div>
  </div>
  <p class="subhead">Tick off syllabus as you cover it. Add your own topics anytime.</p>

  <div class="overview">
    <div class="ring-card">
      <div class="ring-wrap">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="27" fill="none" stroke="#d8e3d9" stroke-width="7"/>
          <circle id="ringFill" cx="32" cy="32" r="27" fill="none" stroke="#2f6f5e" stroke-width="7" stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="169.6"/>
        </svg>
        <div class="ring-label" id="ringPct">0%</div>
      </div>
      <div class="ring-copy">
        <span class="num" id="overallCopy">0 / 0 topics</span>
        <span class="lbl" id="stageLabel">this stage</span>
      </div>
    </div>
  </div>
</header>

<nav class="stage-track" id="stageTrack"></nav>

<div style="padding:0 18px;">
  <button class="add-subject-card" id="openNewSubject">+ Add a subject</button>
  <div class="new-subject-form" id="newSubjectForm">
    <input type="text" id="newSubjectName" placeholder="Subject name, e.g. Statistics">
    <div class="form-actions">
      <button id="cancelNewSubject">Cancel</button>
      <button class="primary" id="saveNewSubject">Add subject</button>
    </div>
  </div>
</div>

<main id="subjectsWrap"></main>

<button class="fab" id="fabTimer">
  <span class="dot"></span>
  <span id="fabLabel">Study timer</span>
</button>

<div class="scrim" id="scrim"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <h2>Study timer <button id="closeDrawer">&times;</button></h2>

  <div class="timer-subject">
    <select id="timerSubjectSelect"></select>
  </div>

  <div class="mode-toggle">
    <button id="modeCountdown" class="active">Focus timer</button>
    <button id="modeStopwatch">Stopwatch</button>
  </div>

  <div class="presets" id="presets">
    <button data-min="15">15m</button>
    <button data-min="25" class="active">25m</button>
    <button data-min="45">45m</button>
    <button data-min="60">60m</button>
  </div>

  <div class="timer-display">
    <div class="clock" id="clock">25:00</div>
    <div class="sub" id="clockSub">ready when you are</div>
  </div>

  <div class="timer-controls" id="timerControls">
    <button class="btn-start" id="btnStart">Start</button>
  </div>

  <div class="stats-title">Time logged today</div>
  <div id="statsList"><div class="no-stats">No sessions logged yet — finish a timer to see it here.</div></div>

<script>
/* ---------------- Data & storage ---------------- */
const DEFAULT_SUBJECTS = JSON.parse(document.getElementById('subjectsData').textContent);
const STAGES = [
  { key: 'ct1', short: 'CT 1', full: 'CT — before Half-Yearly', track: 1, linkedStage: 'ardhabarshik', linkedLabel: 'Half-Yearly' },
  { key: 'ardhabarshik', short: 'Half-Yearly', full: 'Half-Yearly Exam (অর্ধবার্ষিক)', track: 1 },
  { key: 'bariki', short: 'Annual', full: 'Annual Exam (বার্ষিক)', track: 1 },
  { key: 'ct2', short: 'CT 2', full: 'CT — before Pre-Selection', track: 2, linkedStage: 'prak_nirbachoni', linkedLabel: 'Pre-Selection' },
  { key: 'prak_nirbachoni', short: 'Pre-Selection', full: 'Pre-Selection Exam (প্রাক নির্বাচনী)', track: 2 },
  { key: 'nirbachoni', short: 'Selection', full: 'Selection Exam (নির্বাচনী)', track: 2 }
];
const STORAGE_KEY = 'hsc-tracker-state-v1';

let state = {
  checked: {},          // itemId -> true
  customItems: {},       // "subjectId|stage" -> [{id,text}]
  hiddenItems: {},        // itemId -> true (soft-deleted default items)
  customSubjects: [],     // extra subjects, same shape as DEFAULT_SUBJECTS entries but with id
  timerLogs: []           // {subjectId, subjectName, minutes, date(ISO)}
};

let currentStage = 'ct1';
let expandedLinks = {}; // session-only: which CT link panels are expanded
let saveTimer = null;

// window.storage only exists inside Claude's artifact sandbox. When this file
// is downloaded and opened directly in a browser, it's undefined — so we
// fall back to localStorage in that case, and try cloud storage first when available.
function hasCloudStorage() {
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}

async function loadState() {
  try {
    if (hasCloudStorage()) {
      const res = await window.storage.get(STORAGE_KEY, false);
      if (res && res.value) {
        state = Object.assign(state, JSON.parse(res.value));
      }
      return;
    }
  } catch (e) {
    // fall through to localStorage below
  }
  try {
    const raw = window.localStorage.getItem(STORAGE_KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
  } catch (e) {
    console.error('local load failed', e);
  }
}

function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    const payload = JSON.stringify(state);
    let cloudOk = false;
    if (hasCloudStorage()) {
      try {
        await window.storage.set(STORAGE_KEY, payload, false);
        cloudOk = true;
      } catch (e) {
        console.error('cloud save failed, falling back to local', e);
      }
    }
    if (!cloudOk) {
      try {
        window.localStorage.setItem(STORAGE_KEY, payload);
      } catch (e) {
        console.error('local save failed', e);
        toast('Could not save — check browser storage settings');
      }
    }
  }, 250);
}

/* ---------------- Helpers ---------------- */
function allSubjects() {
  return DEFAULT_SUBJECTS.concat(state.customSubjects);
}

function subjectId(subj, idx) {
  return subj.id || ('s' + idx);
}

function itemsForStage(subj, stageKey) {
  const base = (subj.exams[stageKey] && subj.exams[stageKey].items) || [];
  const visible = base.filter(it => !state.hiddenItems[it.id]);
  const key = subj.__sid + '|' + stageKey;
  const extra = state.customItems[key] || [];
  return visible.concat(extra);
}

function notesForStage(subj, stageKey) {
  return (subj.exams[stageKey] && subj.exams[stageKey].notes) || '';
}

function progress(items) {
  if (!items.length) return { done: 0, total: 0, pct: 0 };
  const done = items.filter(it => state.checked[it.id]).length;
  return { done, total: items.length, pct: Math.round((done / items.length) * 100) };
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------------- Render: stage tabs ---------------- */
function renderStageTabs() {
  const wrap = document.getElementById('stageTrack');
  wrap.innerHTML = '';
  const subs = allSubjects();

  STAGES.forEach((st, i) => {
    let doneAll = 0, totalAll = 0;
    subs.forEach(s => {
      const items = itemsForStage(s, st.key);
      totalAll += items.length;
      doneAll += items.filter(it => state.checked[it.id]).length;
    });
    const pct = totalAll ? Math.round((doneAll / totalAll) * 100) : 0;
    const posInTrack = st.track === 1 ? i + 1 : i - 2;

    const btn = document.createElement('button');
    btn.className = 'stage-btn' + (currentStage === st.key ? ' active' : '');
    btn.innerHTML = `<span class="n">STEP ${posInTrack}</span><span>${st.short}</span>
      <span class="stage-progress-mini"><i style="width:${pct}%"></i></span>`;
    btn.addEventListener('click', () => { currentStage = st.key; renderAll(); });
    wrap.appendChild(btn);
  });
}

/* ---------------- Render: overview ring ---------------- */
function renderOverview() {
  const subs = allSubjects();
  let done = 0, total = 0;
  subs.forEach(s => {
    const items = itemsForStage(s, currentStage);
    total += items.length;
    done += items.filter(it => state.checked[it.id]).length;
  });
  const pct = total ? Math.round((done / total) * 100) : 0;
  const circumference = 169.6;
  const offset = circumference - (circumference * pct / 100);
  document.getElementById('ringFill').style.strokeDashoffset = offset;
  document.getElementById('ringPct').textContent = pct + '%';
  document.getElementById('overallCopy').textContent = `${done} / ${total} topics`;
  const stageMeta = STAGES.find(s => s.key === currentStage);
  document.getElementById('stageLabel').textContent = stageMeta.full;
}

/* ---------------- Render: subject cards ---------------- */
function renderSubjects() {
  const wrap = document.getElementById('subjectsWrap');
  wrap.innerHTML = '';
  const subs = allSubjects();

  subs.forEach((subj, idx) => {
    const sid = subj.__sid;
    const items = itemsForStage(subj, currentStage);
    const notes = notesForStage(subj, currentStage);
    const p = progress(items);

    const card = document.createElement('div');
    card.className = 'subject-card';

    const top = document.createElement('div');
    top.className = 'subject-top';
    top.innerHTML = `
      <div>
        <div class="subject-name">${escapeHtml(subj.name)}</div>
        ${notes ? `<div class="subject-notes">${escapeHtml(notes)}</div>` : ''}
      </div>
      <div class="subject-pct">${p.done}/${p.total}</div>
    `;
    card.appendChild(top);

    const barTrack = document.createElement('div');
    barTrack.className = 'bar-track';
    barTrack.innerHTML = `<div class="bar-fill" style="width:${p.pct}%"></div>`;
    card.appendChild(barTrack);

    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'items';

    if (items.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'empty-items';
      empty.textContent = 'No topics yet for this stage — add one below.';
      itemsWrap.appendChild(empty);
    }

    items.forEach(it => {
      const row = document.createElement('div');
      row.className = 'item-row' + (state.checked[it.id] ? ' done' : '');
      row.innerHTML = `
        <button class="chk" aria-label="toggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
        <div class="item-text">${escapeHtml(it.text)}</div>
        <button class="del-btn" aria-label="remove">&times;</button>
      `;
      const toggle = () => {
        state.checked[it.id] = !state.checked[it.id];
        persist();
        renderAll();
      };
      row.querySelector('.chk').addEventListener('click', toggle);
      row.querySelector('.item-text').addEventListener('click', toggle);
      row.querySelector('.del-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        removeItem(subj, currentStage, it.id);
      });
      itemsWrap.appendChild(row);
    });

    const stageMeta = STAGES.find(s => s.key === currentStage);
    if (stageMeta && stageMeta.linkedStage) {
      const linkedItems = itemsForStage(subj, stageMeta.linkedStage);
      const linkedProgress = progress(linkedItems);

      const linkPanel = document.createElement('div');
      linkPanel.className = 'link-panel';

      const header = document.createElement('div');
      header.className = 'link-toggle';
      header.innerHTML = `
        <span>${escapeHtml(stageMeta.linkedLabel)} chapter list</span>
        <span class="link-count">${linkedProgress.done}/${linkedProgress.total}</span>
      `;
      linkPanel.appendChild(header);

      const linkList = document.createElement('div');
      linkList.className = 'link-list';
      if (linkedItems.length === 0) {
        const emptyLink = document.createElement('div');
        emptyLink.className = 'empty-items';
        emptyLink.textContent = `No ${stageMeta.linkedLabel} topics yet.`;
        linkList.appendChild(emptyLink);
      }
      linkedItems.forEach(it => {
        const row2 = document.createElement('div');
        row2.className = 'item-row linked' + (state.checked[it.id] ? ' done' : '');
        row2.innerHTML = `
          <button class="chk" aria-label="toggle">
            <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <div class="item-text">${escapeHtml(it.text)}</div>
        `;
        const toggle2 = () => {
          state.checked[it.id] = !state.checked[it.id];
          persist();
          renderAll();
        };
        row2.querySelector('.chk').addEventListener('click', toggle2);
        row2.querySelector('.item-text').addEventListener('click', toggle2);
        linkList.appendChild(row2);
      });
      linkPanel.appendChild(linkList);
      itemsWrap.appendChild(linkPanel);
    }

    const addRow = document.createElement('div');
    addRow.className = 'add-item-row';
    addRow.innerHTML = `
      <input type="text" placeholder="Add a topic..." />
      <button>Add</button>
    `;
    const input = addRow.querySelector('input');
    const addBtn = addRow.querySelector('button');
    const doAdd = () => {
      const text = input.value.trim();
      if (!text) return;
      const key = sid + '|' + currentStage;
      if (!state.customItems[key]) state.customItems[key] = [];
      state.customItems[key].push({ id: 'c' + sid + '_' + currentStage + '_' + Date.now(), text });
      input.value = '';
      persist();
      renderAll();
    };
    addBtn.addEventListener('click', doAdd);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') doAdd(); });
    itemsWrap.appendChild(addRow);

    card.appendChild(itemsWrap);
    wrap.appendChild(card);
  });
}

function removeItem(subj, stageKey, itemId) {
  const key = subj.__sid + '|' + stageKey;
  if (state.customItems[key]) {
    const before = state.customItems[key].length;
    state.customItems[key] = state.customItems[key].filter(it => it.id !== itemId);
    if (state.customItems[key].length !== before) {
      persist();
      renderAll();
      return;
    }
  }
  // else it's a default item -> hide it
  state.hiddenItems[itemId] = true;
  persist();
  renderAll();
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* ---------------- Add subject ---------------- */
function setupAddSubject() {
  const openBtn = document.getElementById('openNewSubject');
  const form = document.getElementById('newSubjectForm');
  const nameInput = document.getElementById('newSubjectName');
  const cancel = document.getElementById('cancelNewSubject');
  const save = document.getElementById('saveNewSubject');

  openBtn.addEventListener('click', () => {
    form.classList.add('open');
    nameInput.focus();
  });
  cancel.addEventListener('click', () => {
    form.classList.remove('open');
    nameInput.value = '';
  });
  save.addEventListener('click', () => {
    const name = nameInput.value.trim();
    if (!name) return;
    const id = 'custom' + Date.now();
    state.customSubjects.push({
      id,
      name,
      exams: {
        ct: { notes: '', items: [] },
        pretest: { notes: '', items: [] },
        test: { notes: '', items: [] }
      }
    });
    nameInput.value = '';
    form.classList.remove('open');
    persist();
    renderAll();
    toast('Subject added — scroll down to add topics');
  });
}

/* ---------------- Master render ---------------- */
function renderAll() {
  // tag subjects with stable __sid the first time
  DEFAULT_SUBJECTS.forEach((s, i) => { if (!s.__sid) s.__sid = s.id || ('s' + i); });
  state.customSubjects.forEach((s) => { if (!s.__sid) s.__sid = s.id; });

  renderStageTabs();
  renderOverview();
  renderSubjects();
  renderTimerSubjectOptions();
  renderStats();
}

/* ================= TIMER ================= */
let timerMode = 'countdown'; // or 'stopwatch'
let presetMinutes = 25;
let remainingSeconds = presetMinutes * 60;
let elapsedSeconds = 0;
let timerInterval = null;
let timerRunning = false;

function renderTimerSubjectOptions() {
  const sel = document.getElementById('timerSubjectSelect');
  const prevVal = sel.value;
  sel.innerHTML = '';
  allSubjects().forEach(s => {
    const opt = document.createElement('option');
    opt.value = s.__sid;
    opt.textContent = s.name;
    sel.appendChild(opt);
  });
  if (prevVal) sel.value = prevVal;
}

function formatClock(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function updateClockDisplay() {
  const clock = document.getElementById('clock');
  const sub = document.getElementById('clockSub');
  if (timerMode === 'countdown') {
    clock.textContent = formatClock(remainingSeconds);
    sub.textContent = timerRunning ? 'focus session running' : (remainingSeconds === presetMinutes * 60 ? 'ready when you are' : 'paused');
  } else {
    clock.textContent = formatClock(elapsedSeconds);
    sub.textContent = timerRunning ? 'stopwatch running' : (elapsedSeconds === 0 ? 'ready when you are' : 'paused');
  }
}

function tick() {
  if (timerMode === 'countdown') {
    remainingSeconds--;
    if (remainingSeconds <= 0) {
      remainingSeconds = 0;
      updateClockDisplay();
      finishTimer(true);
      return;
    }
  } else {
    elapsedSeconds++;
  }
  updateClockDisplay();
}

function setControls() {
  const controls = document.getElementById('timerControls');
  controls.innerHTML = '';
  if (!timerRunning && ((timerMode === 'countdown' && remainingSeconds === presetMinutes * 60) || (timerMode === 'stopwatch' && elapsedSeconds === 0))) {
    controls.innerHTML = `<button class="btn-start" id="btnStart">Start</button>`;
    document.getElementById('btnStart').addEventListener('click', startTimer);
  } else if (timerRunning) {
    controls.innerHTML = `<button class="btn-pause" id="btnPause">Pause</button>`;
    document.getElementById('btnPause').addEventListener('click', pauseTimer);
  } else {
    controls.innerHTML = `
      <button class="btn-start" id="btnResume">Resume</button>
      <button class="btn-log" id="btnLog">Log & finish</button>
      <button class="btn-reset" id="btnReset">Reset</button>
    `;
    document.getElementById('btnResume').addEventListener('click', startTimer);
    document.getElementById('btnLog').addEventListener('click', () => finishTimer(false));
    document.getElementById('btnReset').addEventListener('click', resetTimer);
  }
  updateFab();
}

function startTimer() {
  timerRunning = true;
  timerInterval = setInterval(tick, 1000);
  setControls();
  updateClockDisplay();
}

function pauseTimer() {
  timerRunning = false;
  clearInterval(timerInterval);
  setControls();
  updateClockDisplay();
}

function resetTimer() {
  timerRunning = false;
  clearInterval(timerInterval);
  remainingSeconds = presetMinutes * 60;
  elapsedSeconds = 0;
  setControls();
  updateClockDisplay();
}

function finishTimer(auto) {
  timerRunning = false;
  clearInterval(timerInterval);
  const minutes = timerMode === 'countdown'
    ? Math.round((presetMinutes * 60 - remainingSeconds) / 60)
    : Math.round(elapsedSeconds / 60);

  if (minutes > 0) {
    const sel = document.getElementById('timerSubjectSelect');
    const subj = allSubjects().find(s => s.__sid === sel.value);
    state.timerLogs.push({
      subjectId: sel.value,
      subjectName: subj ? subj.name : 'Unknown',
      minutes,
      date: new Date().toISOString()
    });
    persist();
    renderStats();
    toast(auto ? `Nice work! Logged ${minutes} min.` : `Logged ${minutes} min.`);
  } else if (auto) {
    toast('Focus session complete!');
  }
  remainingSeconds = presetMinutes * 60;
  elapsedSeconds = 0;
  setControls();
  updateClockDisplay();
}

function updateFab() {
  const fab = document.getElementById('fabTimer');
  const label = document.getElementById('fabLabel');
  if (timerRunning) {
    fab.classList.add('running');
    const remaining = timerMode === 'countdown' ? formatClock(remainingSeconds) : formatClock(elapsedSeconds);
    label.textContent = remaining;
  } else {
    fab.classList.remove('running');
    label.textContent = 'Study timer';
  }
}

function renderStats() {
  const list = document.getElementById('statsList');
  const todayStr = new Date().toDateString();
  const todayLogs = state.timerLogs.filter(l => new Date(l.date).toDateString() === todayStr);
  if (!todayLogs.length) {
    list.innerHTML = `<div class="no-stats">No sessions logged yet — finish a timer to see it here.</div>`;
    return;
  }
  const bySubject = {};
  todayLogs.forEach(l => { bySubject[l.subjectName] = (bySubject[l.subjectName] || 0) + l.minutes; });
  list.innerHTML = Object.entries(bySubject)
    .sort((a, b) => b[1] - a[1])
    .map(([name, mins]) => `<div class="stat-row"><span class="t">${escapeHtml(name)}</span><span class="m">${mins} min</span></div>`)
    .join('');
}

/* ---------------- Drawer open/close ---------------- */
function setupDrawer() {
  const fab = document.getElementById('fabTimer');
  const drawer = document.getElementById('drawer');
  const scrim = document.getElementById('scrim');
  const closeBtn = document.getElementById('closeDrawer');

  const open = () => { drawer.classList.add('open'); scrim.classList.add('open'); };
  const close = () => { drawer.classList.remove('open'); scrim.classList.remove('open'); };

  fab.addEventListener('click', open);
  closeBtn.addEventListener('click', close);
  scrim.addEventListener('click', close);

  document.getElementById('modeCountdown').addEventListener('click', () => {
    timerMode = 'countdown';
    document.getElementById('modeCountdown').classList.add('active');
    document.getElementById('modeStopwatch').classList.remove('active');
    document.getElementById('presets').style.display = 'flex';
    resetTimer();
  });
  document.getElementById('modeStopwatch').addEventListener('click', () => {
    timerMode = 'stopwatch';
    document.getElementById('modeStopwatch').classList.add('active');
    document.getElementById('modeCountdown').classList.remove('active');
    document.getElementById('presets').style.display = 'none';
    resetTimer();
  });

  document.querySelectorAll('#presets button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#presets button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      presetMinutes = parseInt(btn.dataset.min, 10);
      resetTimer();
    });
  });
}

/* ---------------- Init ---------------- */
async function init() {
  await loadState();
  setupAddSubject();
  setupDrawer();
  renderAll();
  updateClockDisplay();
  setControls();
}

init();

</script>
